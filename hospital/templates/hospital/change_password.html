{% extends 'hospital/base.html' %}
{% block title %}Set New Password — MediCare HMS{% endblock %}

{% block content %}
<div class="auth-card" style="max-width:400px;">
  <div class="auth-card-header">
    <div class="auth-logo"><i class="fas fa-key"></i></div>
    <div class="auth-title">Welcome Aboard</div>
    <div class="auth-subtitle">Please set a new, secure password to continue.</div>
  </div>
  <div class="auth-card-body">
    <form method="post" class="auth-form">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-input" placeholder="At least 8 characters" required minlength="8">
      </div>
      
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-input" placeholder="Type it again" required minlength="8">
      </div>

      <button type="submit" class="auth-submit" style="margin-top:24px;">
        <i class="fas fa-lock"></i> Set Password & Continue
      </button>
    </form>
  </div>
</div>
{% endblock %}
